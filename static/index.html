<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPay Manager</title>
<style>
  :root {
    --red: #FF3B30;
    --red-dark: #E02020;
    --red-light: #FFF0EF;
    --bg: #F4F4F6;
    --white: #FFFFFF;
    --border: #E5E5EA;
    --text: #1C1C1E;
    --text2: #6C6C70;
    --text3: #AEAEB2;
    --green: #34C759;
    --yellow: #FF9500;
    --blue: #007AFF;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.04);
    --mono: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg, #FF3B30 0%, #FF6B35 100%);
    padding: 20px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .header-logo-icon {
    width: 28px; height: 28px;
    background: #fff;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: 16px;
    color: var(--red);
    letter-spacing: -0.5px;
  }
  .header-title {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-sub {
    color: rgba(255,255,255,.75);
    font-size: 12px;
    margin-top: 2px;
  }

  /* ── Main layout ── */
  .main {
    max-width: 640px;
    margin: -16px auto 0;
    padding: 0 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Section ── */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0 4px;
    margin-bottom: 6px;
  }

  /* ── Card ── */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── Account row ── */
  .account-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    position: relative;
  }
  .account-row + .account-row {
    border-top: 1px solid var(--border);
  }
  .account-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--red-light);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }
  .account-body { flex: 1; min-width: 0; }
  .account-phone {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account-meta {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account-balance {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .account-balance small {
    font-size: 12px;
    font-weight: 400;
    color: var(--text2);
    margin-left: 1px;
  }
  .account-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── Status dot ── */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
    position: relative;
    top: -0.5px;
  }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }
  .dot-gray { background: var(--text3); }

  /* ── Pill buttons ── */
  .pill {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, opacity .12s;
  }
  .pill:hover { background: var(--border); }
  .pill:disabled { opacity: .4; cursor: default; }
  .pill-red { background: var(--red-light); border-color: rgba(255,59,48,.2); color: var(--red); }
  .pill-red:hover { background: rgba(255,59,48,.15); }

  /* ── Add account area ── */
  .add-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    cursor: pointer;
    border-top: 1px solid var(--border);
  }
  .add-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    color: var(--text3);
  }
  .add-label { color: var(--text2); font-size: 14px; }

  /* ── Expandable form ── */
  .form-panel {
    padding: 16px;
    border-top: 1px solid var(--border);
    background: #FAFAFA;
  }
  .form-row { display: flex; gap: 10px; }
  @media (max-width: 480px) { .form-row { flex-direction: column; } }
  .form-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .form-field label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .form-input {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: var(--mono);
    transition: border-color .15s, box-shadow .15s;
    width: 100%;
  }
  .form-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,.12);
  }
  .form-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ── Primary button ── */
  .btn-primary {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .12s, opacity .12s;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
  }
  .btn-ghost:hover { background: var(--bg); }

  /* ── OTP banner ── */
  .otp-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border-top: 3px solid var(--yellow);
    padding: 16px;
  }
  .otp-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .otp-header-icon {
    width: 32px; height: 32px;
    background: rgba(255,149,0,.12);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .otp-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .otp-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .otp-input-row { display: flex; gap: 8px; align-items: center; }
  .otp-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-size: 22px;
    letter-spacing: 0.3em;
    width: 140px;
    font-family: var(--mono);
    outline: none;
    text-align: center;
    font-weight: 700;
    transition: border-color .15s;
  }
  .otp-input:focus { border-color: var(--yellow); }

  /* ── Balance row in payment section ── */
  .pay-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pay-section-head {
    padding: 14px 16px 0;
  }
  .pay-section-head .section-label { margin-bottom: 0; }
  .pay-body { padding: 14px 16px 16px; }
  .pay-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .pay-field:last-of-type { margin-bottom: 0; }
  .pay-field label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .pay-select, .pay-text-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: var(--mono);
    transition: border-color .15s;
    width: 100%;
  }
  .pay-select:focus, .pay-text-input:focus { border-color: var(--red); }

  /* ── History ── */
  .history-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .history-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .history-row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .history-row:last-child { border-bottom: none; }
  .history-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .history-icon-paid { background: rgba(52,199,89,.12); }
  .history-icon-pending { background: rgba(255,149,0,.12); }
  .history-icon-review { background: rgba(255,59,48,.12); }
  .history-icon-other { background: var(--bg); }
  .history-body { flex: 1; min-width: 0; }
  .history-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-phone { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .history-right { text-align: right; flex-shrink: 0; }
  .history-amount { font-size: 16px; font-weight: 700; color: var(--text); }
  .history-amount small { font-size: 11px; font-weight: 400; color: var(--text2); }
  .history-date { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── Status chip ── */
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .chip-green { background: rgba(52,199,89,.12); color: #1E8A3E; }
  .chip-yellow { background: rgba(255,149,0,.12); color: #B06000; }
  .chip-red { background: rgba(255,59,48,.1); color: var(--red); }
  .chip-gray { background: var(--bg); color: var(--text3); border: 1px solid var(--border); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: rgba(28,28,30,.9);
    color: #fff;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    max-width: calc(100vw - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform .25s cubic-bezier(.32,1,.4,1);
    z-index: 999;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: rgba(52,199,89,.9); }
  #toast.error { background: rgba(255,59,48,.9); }
  #toast.info { background: rgba(255,149,0,.9); }

  /* ── Spinner ── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: -2px;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Empty ── */
  .empty { text-align: center; padding: 32px 16px; color: var(--text3); font-size: 13px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* ── Divider ── */
  hr.divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  /* ── Cold start overlay ── */
  #cold-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 9999;
    transition: opacity .4s ease;
  }
  #cold-overlay.fade-out { opacity: 0; pointer-events: none; }
  .cold-logo {
    width: 64px; height: 64px;
    background: linear-gradient(160deg, #FF3B30 0%, #FF6B35 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,59,48,.3);
  }
  .cold-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .cold-sub {
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    line-height: 1.6;
  }
  .cold-bar-wrap {
    width: 200px;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .cold-bar {
    height: 100%;
    background: linear-gradient(90deg, #FF3B30, #FF6B35);
    border-radius: 999px;
    width: 20%;
    animation: cold-pulse 1.4s ease-in-out infinite;
  }
  @keyframes cold-pulse {
    0%   { width: 10%; margin-left: 0; }
    50%  { width: 60%; margin-left: 20%; }
    100% { width: 10%; margin-left: 90%; }
  }
  .cold-timer {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
  }
</style>
</head>
<body>

<!-- Cold start overlay -->
<div id="cold-overlay">
  <div class="cold-logo">P</div>
  <div class="cold-title">PayPay Manager</div>
  <div class="cold-bar-wrap"><div class="cold-bar"></div></div>
  <div class="cold-sub">サーバーを起動しています…<br>初回アクセスは最大30秒かかります</div>
  <div class="cold-timer" id="cold-timer">0秒経過</div>
</div>

<div class="header">
  <div class="header-logo">
    <div class="header-logo-icon">P</div>
    <span class="header-title">PayPay Manager</span>
  </div>
  <div class="header-sub">アカウント管理・送金受取</div>
</div>

<div class="main">

  <!-- Accounts -->
  <div>
    <div class="section-label">登録アカウント</div>
    <div class="card">
      <div id="account-list">
        <div class="empty"><div class="empty-icon">👤</div>読み込み中…</div>
      </div>
      <!-- Add row toggle -->
      <div class="add-row" onclick="toggleAddForm()" id="add-toggle-row">
        <div class="add-icon">＋</div>
        <span class="add-label">アカウントを追加</span>
      </div>
      <!-- Expand form -->
      <div id="add-form" style="display:none">
        <div class="form-panel">
          <div class="form-row">
            <div class="form-field">
              <label>電話番号</label>
              <input class="form-input" type="tel" id="add-phone" placeholder="09012345678" autocomplete="off">
            </div>
            <div class="form-field">
              <label>パスワード</label>
              <input class="form-input" type="password" id="add-pass" placeholder="パスワード" autocomplete="current-password">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" id="add-submit-btn" onclick="submitLogin()">ログイン</button>
            <button class="btn-ghost" onclick="toggleAddForm()">キャンセル</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- OTP banner -->
  <div id="otp-banner" style="display:none">
    <div class="otp-card">
      <div class="otp-header">
        <div class="otp-header-icon">📱</div>
        <div>
          <div class="otp-title">SMS認証コードを入力</div>
          <div class="otp-sub"><span id="otp-phone-label"></span> · プレフィックス: <span id="otp-prefix-label" style="font-family:var(--mono);font-weight:600;color:var(--yellow)"></span></div>
        </div>
      </div>
      <div class="otp-input-row">
        <input class="otp-input" type="number" id="otp-input" placeholder="0000" maxlength="4"
          oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)">
        <button class="btn-primary" id="otp-submit-btn" onclick="submitOtp()">送信</button>
        <button class="btn-ghost" onclick="cancelOtp()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- Payment receive -->
  <div>
    <div class="section-label">送金リンク受取</div>
    <div class="pay-card">
      <div class="pay-body">
        <div class="pay-field">
          <label>受取アカウント</label>
          <select class="pay-select" id="pay-phone">
            <option value="">-- アカウントを選択 --</option>
          </select>
        </div>
        <div class="pay-field">
          <label>PayPay送金リンク</label>
          <input class="pay-text-input" type="text" id="pay-link" placeholder="https://pay.paypay.ne.jp/…">
        </div>
        <div class="pay-field">
          <label>金額（円）</label>
          <input class="pay-text-input" type="number" id="pay-amount" placeholder="1000" min="1"
            style="font-size:18px;font-weight:700;">
        </div>
        <div style="margin-top:14px">
          <button class="btn-primary" id="pay-btn" onclick="receivePayment()" style="width:100%;padding:13px;font-size:15px">
            受取実行
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Payment history -->
  <div>
    <div class="section-label">受取履歴</div>
    <div class="history-card">
      <div id="history-body">
        <div class="empty"><div class="empty-icon">📋</div>読み込み中…</div>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let pendingOtpPhone = null;
let accounts = [];
const balanceCache = {};

// ── Utilities ──────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.className = '', 3500);
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) { btn._orig = btn.innerHTML; btn.innerHTML = `<span class="spinner"></span>${label || '処理中…'}`; }
  else btn.innerHTML = btn._orig || label || btn.innerHTML;
}

function timeLeft(expiresAt) {
  if (!expiresAt) return null;
  const diff = expiresAt - Date.now() / 1000;
  if (diff <= 0) return null;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  if (h > 0) return `${h}時間${m}分`;
  return `${m}分`;
}

function formatDatetime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('ja-JP', { month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit' });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw { status: res.status, detail: body.detail || body };
  return body;
}

// ── Render accounts ────────────────────────────────────────────────────────
function renderAccounts(list) {
  accounts = list;
  const el = document.getElementById('account-list');

  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">👤</div>登録済みのアカウントがありません</div>';
    updatePayPhone(list);
    return;
  }

  el.innerHTML = list.map(a => {
    const phone = escHtml(a.phone);
    let dot, meta;

    if (!a.registered) {
      dot = '<span class="dot dot-gray"></span>';
      meta = '認証情報なし';
    } else if (a.otp_pending) {
      dot = '<span class="dot dot-yellow"></span>';
      meta = 'SMS認証コード待機中';
    } else if (a.valid) {
      const left = timeLeft(a.expires_at);
      dot = '<span class="dot dot-green"></span>';
      meta = left ? `残り${left}` : 'セッション有効';
      if (!a.payment_ready) meta += '・受取不可';
    } else {
      dot = '<span class="dot dot-red"></span>';
      meta = '期限切れ・再ログイン必要';
    }

    const cached = balanceCache[a.phone];
    const balanceHtml = cached != null
      ? `<div class="account-balance">¥${cached.toLocaleString()}<small>円</small></div>`
      : '';

    return `
      <div class="account-row">
        <div class="account-icon">👤</div>
        <div class="account-body">
          <div class="account-phone">${phone}</div>
          <div class="account-meta">${dot}${meta}</div>
        </div>
        ${balanceHtml}
        <div class="account-actions">
          ${a.valid ? `<button class="pill" id="bal-btn-${phone}" onclick="fetchBalance('${phone}')">残高</button>` : ''}
          <button class="pill" onclick="refreshAccount('${phone}')">更新</button>
          <button class="pill pill-red" onclick="deleteAccount('${phone}')">削除</button>
        </div>
      </div>
    `;
  }).join('');

  updatePayPhone(list);
}

function updatePayPhone(list) {
  const sel = document.getElementById('pay-phone');
  const current = sel.value;
  sel.innerHTML = '<option value="">-- アカウントを選択 --</option>'
    + list.filter(a => a.valid && a.payment_ready)
          .map(a => `<option value="${escHtml(a.phone)}">${escHtml(a.phone)}</option>`)
          .join('');
  if (current) sel.value = current;
}

// ── Render history ─────────────────────────────────────────────────────────
function renderHistory(rows) {
  const el = document.getElementById('history-body');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>受取履歴がありません</div>';
    return;
  }
  const iconMap = {
    paid: { cls: 'history-icon-paid', icon: '✓' },
    pending: { cls: 'history-icon-pending', icon: '⏳' },
    review: { cls: 'history-icon-review', icon: '!' },
  };
  const chipMap = {
    paid: '<span class="chip chip-green">受取完了</span>',
    pending: '<span class="chip chip-yellow">保留中</span>',
    review: '<span class="chip chip-red">要確認</span>',
    attempted: '<span class="chip chip-gray">処理中</span>',
  };
  el.innerHTML = rows.map(r => {
    const ic = iconMap[r.status] || { cls: 'history-icon-other', icon: '·' };
    const chip = chipMap[r.status] || `<span class="chip chip-gray">${escHtml(r.status)}</span>`;
    return `
      <div class="history-row">
        <div class="history-icon ${ic.cls}">${ic.icon}</div>
        <div class="history-body">
          <div class="history-id">${escHtml(r.order_id.substring(0,16))}…</div>
          <div class="history-phone">${escHtml(r.phone)}</div>
        </div>
        <div class="history-right">
          <div class="history-amount">¥${Number(r.amount).toLocaleString()}<small>円</small></div>
          <div class="history-date">${formatDatetime(r.created_at)}</div>
        </div>
        <div style="flex-shrink:0">${chip}</div>
      </div>
    `;
  }).join('');
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadAccounts() {
  try {
    const list = await apiFetch('/api/accounts');
    renderAccounts(list);
  } catch {
    document.getElementById('account-list').innerHTML =
      '<div class="empty">取得に失敗しました</div>';
  }
}

async function loadHistory() {
  try {
    const rows = await apiFetch('/api/payments');
    renderHistory(rows);
  } catch {
    document.getElementById('history-body').innerHTML =
      '<div class="empty">取得に失敗しました</div>';
  }
}

// ── Add account ────────────────────────────────────────────────────────────
function toggleAddForm() {
  const f = document.getElementById('add-form');
  const visible = f.style.display !== 'none';
  f.style.display = visible ? 'none' : 'block';
  document.getElementById('add-toggle-row').style.display = visible ? 'flex' : 'none';
}

async function submitLogin() {
  const phone = document.getElementById('add-phone').value.trim().replace(/-/g,'');
  const pass  = document.getElementById('add-pass').value;
  if (!phone || !pass) { toast('電話番号とパスワードを入力してください', 'error'); return; }

  setLoading('add-submit-btn', true);
  try {
    const res = await apiFetch('/api/accounts/login', {
      method: 'POST',
      body: JSON.stringify({ phone, password: pass }),
    });

    if (res.status === 'otp_required') {
      pendingOtpPhone = phone;
      document.getElementById('otp-phone-label').textContent = phone;
      document.getElementById('otp-prefix-label').textContent = res.otp_prefix || '';
      document.getElementById('otp-banner').style.display = 'block';
      document.getElementById('otp-input').value = '';
      document.getElementById('otp-input').focus();
      toggleAddForm();
      toast(`OTP認証が必要です（プレフィックス: ${res.otp_prefix}）`, 'info');
    } else {
      toast('ログイン成功！', 'success');
      toggleAddForm();
      document.getElementById('add-phone').value = '';
      document.getElementById('add-pass').value = '';
      await loadAccounts();
    }
  } catch (e) {
    const err = e.detail?.error || 'error';
    const hint = {
      bad_credentials: '電話番号またはパスワードが違います',
      network_error: 'PayPayへの接続に失敗しました',
      otp_validation_failed: 'OTP検証に失敗しました',
    };
    toast(hint[err] || err, 'error');
  } finally {
    setLoading('add-submit-btn', false, 'ログイン');
  }
}

async function submitOtp() {
  if (!pendingOtpPhone) return;
  const otp = document.getElementById('otp-input').value.trim();
  if (!otp || !/^\d{4}$/.test(otp)) {
    toast('4桁の数字を入力してください', 'error');
    return;
  }

  setLoading('otp-submit-btn', true);
  try {
    await apiFetch('/api/accounts/otp', {
      method: 'POST',
      body: JSON.stringify({ phone: pendingOtpPhone, otp }),
    });
    toast('OTP認証完了！アカウントを登録しました', 'success');
    cancelOtp();
    await loadAccounts();
  } catch (e) {
    const err = e.detail?.error || 'OTP認証に失敗しました';
    toast(err === 'invalid_otp_format' ? '認証コードの形式が正しくありません' : err, 'error');
  } finally {
    setLoading('otp-submit-btn', false, '送信');
  }
}

function cancelOtp() {
  pendingOtpPhone = null;
  document.getElementById('otp-banner').style.display = 'none';
}

// ── Balance ──────────────────────────────────────────────────────────────────
async function fetchBalance(phone) {
  const btn = document.getElementById(`bal-btn-${phone}`);
  if (btn) { btn.disabled = true; btn._orig = btn.innerHTML; btn.innerHTML = '…'; }
  try {
    const res = await apiFetch(`/api/accounts/${encodeURIComponent(phone)}/balance`);
    balanceCache[phone] = res.balance;
    toast(`残高: ¥${res.balance.toLocaleString()}円`, 'success');
    renderAccounts(accounts);
  } catch (e) {
    const err = e.detail?.error || 'error';
    const msg = {
      session_expired: 'セッション切れ。再ログインしてください。',
      network_error: '通信エラーが発生しました',
      api_error: 'PayPay APIエラー',
    };
    toast(msg[err] || err, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = btn._orig || '残高'; }
  }
}

// ── Account actions ─────────────────────────────────────────────────────────
async function refreshAccount(phone) {
  try {
    const res = await apiFetch(`/api/accounts/${encodeURIComponent(phone)}/refresh`, { method: 'POST' });
    if (res.status === 'otp_required') {
      pendingOtpPhone = phone;
      document.getElementById('otp-phone-label').textContent = phone;
      document.getElementById('otp-prefix-label').textContent = res.otp_prefix || '';
      document.getElementById('otp-banner').style.display = 'block';
      document.getElementById('otp-input').value = '';
      toast(`OTP認証が必要です（プレフィックス: ${res.otp_prefix}）`, 'info');
    } else {
      toast(`${phone} のトークンを更新しました`, 'success');
      await loadAccounts();
    }
  } catch (e) {
    toast(e.detail?.error || '更新に失敗しました', 'error');
  }
}

async function deleteAccount(phone) {
  if (!confirm(`${phone} を削除しますか？`)) return;
  try {
    await apiFetch(`/api/accounts/${encodeURIComponent(phone)}`, { method: 'DELETE' });
    delete balanceCache[phone];
    toast(`${phone} を削除しました`, 'success');
    await loadAccounts();
  } catch (e) {
    toast('削除に失敗しました', 'error');
  }
}

// ── Payment receive ─────────────────────────────────────────────────────────
async function receivePayment() {
  const phone  = document.getElementById('pay-phone').value;
  const link   = document.getElementById('pay-link').value.trim();
  const amount = parseInt(document.getElementById('pay-amount').value, 10);

  if (!phone) { toast('受取アカウントを選択してください', 'error'); return; }
  if (!link)  { toast('PayPay送金リンクを入力してください', 'error'); return; }
  if (!amount || amount < 1) { toast('金額を入力してください', 'error'); return; }

  setLoading('pay-btn', true, '受取処理中…');
  try {
    await apiFetch('/api/payments/receive', {
      method: 'POST',
      body: JSON.stringify({ phone, link, amount }),
    });
    toast(`¥${amount.toLocaleString()}円の受取が完了しました！`, 'success');
    document.getElementById('pay-link').value = '';
    document.getElementById('pay-amount').value = '';
    await loadHistory();
  } catch (e) {
    const d = e.detail || {};
    if (d.error === 'temporary_hold') {
      toast(`一時保留: ${d.message}`, 'info');
    } else {
      toast(d.message || d.error || '受取に失敗しました', 'error');
    }
  } finally {
    setLoading('pay-btn', false, '受取実行');
  }
}

// ── Enter key ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('otp-banner').style.display !== 'none'
      && document.activeElement?.id === 'otp-input') {
    submitOtp();
  }
});

// ── Cold start ───────────────────────────────────────────────────────────────
async function waitForServer() {
  const overlay = document.getElementById('cold-overlay');
  const timerEl = document.getElementById('cold-timer');
  const start = Date.now();

  const tick = setInterval(() => {
    timerEl.textContent = `${Math.floor((Date.now() - start) / 1000)}秒経過`;
  }, 1000);

  while (true) {
    try {
      const res = await fetch('/api/health');
      if (res.ok) break;
    } catch (_) {}
    await new Promise(r => setTimeout(r, 2000));
  }

  clearInterval(tick);
  overlay.classList.add('fade-out');
  setTimeout(() => overlay.remove(), 400);
}

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
  await waitForServer();
  await Promise.all([loadAccounts(), loadHistory()]);
  setInterval(loadAccounts, 30000);
})();
</script>
